<div class="mx-auto max-w-xl px-4 py-8">
  <form
    class="rounded-2xl border border-ink/10 bg-white p-6 shadow-sm sm:p-8"
    action="{% url 'enviar_evento' %}"
    method="post"
  >
    {% csrf_token %}

    <!-- Ícone e Cabeçalho -->
    <span
      class="grid h-11 w-11 place-items-center rounded-xl bg-[#fce7d9] text-xl"
      >◷</span
    >
    <h3 class="mt-5 font-bold text-lg text-ink">Submeter evento</h3>
    <p class="mt-1 text-sm leading-6 text-ink/55">
      Sugere uma palestra, workshop ou atividade académica para a comunidade.
    </p>

    <!-- Erros globais -->
    {% if form.non_field_errors %}
      <div class="mt-4 rounded-xl bg-red-50 p-3 text-sm text-red-600">
        {{ form.non_field_errors }}
      </div>
    {% endif %}

    <div class="mt-6 space-y-4">
      <!-- Nome do Evento (Título) -->
      <label class="block text-xs font-bold text-ink" for="{{ form.titulo.id_for_label }}">
        Nome do evento *
        {{ form.titulo }}
        {% if form.titulo.errors %}
          <span class="text-xs text-red-500">{{ form.titulo.errors.0 }}</span>
        {% endif %}
      </label>

      <!-- Local -->
      <label class="block text-xs font-bold text-ink" for="{{ form.local.id_for_label }}">
        Local *
        {{ form.local }}
        {% if form.local.errors %}
          <span class="text-xs text-red-500">{{ form.local.errors.0 }}</span>
        {% endif %}
      </label>

      <!-- Data -->
      <label class="block text-xs font-bold text-ink" for="{{ form.data.id_for_label }}">
        Data *
        {{ form.data }}
        {% if form.data.errors %}
          <span class="text-xs text-red-500">{{ form.data.errors.0 }}</span>
        {% endif %}
      </label>

      <!-- Descrição do Evento -->
      <label class="block text-xs font-bold text-ink" for="{{ form.descricao.id_for_label }}">
        Descrição do evento *
        {{ form.descricao }}
        {% if form.descricao.errors %}
          <span class="text-xs text-red-500">{{ form.descricao.errors.0 }}</span>
        {% endif %}
      </label>
    </div>

    <!-- Botão de Submissão -->
    <button
      type="submit"
      class="mt-6 w-full cursor-pointer rounded-xl bg-forest py-3.5 text-sm font-bold text-white transition hover:bg-ink"
    >
      Enviar proposta
    </button>
  </form>
</div>
