section class="container my-5">
  <div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
      <div class="card border-0 shadow-sm p-4 rounded-3">
        <h2 class="h4 fw-bold text-center mb-4">Entra em Contacto</h2>
        <form>
          <div class="mb-3">
            <label for="nome" class="form-label font-semibold">Nome</label>
            <input type="text" class="form-control" id="nome" placeholder="O teu nome completo">
          </div>
          <div class="mb-3">
            <label for="email" class="form-label">E-mail</label>
            <input type="email" class="form-control" id="email" placeholder="nome@exemplo.com">
          </div>
          <div class="mb-3">
            <label for="mensagem" class="form-label">Mensagem</label>
            <textarea class="form-control" id="mensagem" rows="4" placeholder="Como podemos ajudar?"></textarea>
          </div>
          <button type="submit" class="btn btn-primary w-100 fw-bold">Enviar Mensagem</button>
        </form>
      </div>
    </div>
  </div>
</section>
