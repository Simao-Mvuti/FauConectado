<div id="container-form-materias" class="mt-6 hidden w-full">
  <form
    id="form-materias"
    class="w-full rounded-2xl border border-ink/10 bg-white p-6 shadow-sm sm:p-8"
    action="{% url 'materias' %}"
    method="post"
    enctype="multipart/form-data"
  >
    {% csrf_token %}

    <!-- Cabeçalho do Formulário com Botão Fechar -->
    <div class="flex items-center justify-between">
      <span
        class="grid h-11 w-11 place-items-center rounded-xl bg-[#e7edff] text-xl"
        >↑</span
      >
      <button
        type="button"
        onclick="toggleFormulario()"
        class="text-xs font-bold text-ink/40 hover:text-ink"
      >
        ✕ Fechar
      </button>
    </div>

    <h3 class="mt-5 font-bold text-lg">Enviar material</h3>
    <p class="mt-1 text-sm leading-6 text-ink/55">
      Partilha um resumo, apontamento ou ficheiro de uma cadeira.
    </p>

    <!-- Exibir erros gerais do formulário (ex: validação do PDF) -->
    {% if form.non_field_errors %}
      <div class="mt-4 rounded-xl bg-red-50 p-3 text-sm text-red-600">
        {{ form.non_field_errors }}
      </div>
    {% endif %}

    <!-- Campos em Grelha (1 coluna em mobile, 2 em desktop) -->
    <div class="mt-6 grid gap-4 md:grid-cols-2">
      <!-- Cadeira -->
      <label class="block text-xs font-bold text-ink" for="{{ form.cadeira.id_for_label }}">
        Cadeira *
        {{ form.cadeira }}
        {% if form.cadeira.errors %}
          <span class="text-xs text-red-500">{{ form.cadeira.errors.0 }}</span>
        {% endif %}
      </label>

      <!-- Ficheiro -->
      <label class="block text-xs font-bold text-ink" for="{{ form.ficheiro.id_for_label }}">
        Ficheiro *
        {{ form.ficheiro }}
        {% if form.ficheiro.errors %}
          <span class="text-xs text-red-500">{{ form.ficheiro.errors.0 }}</span>
        {% endif %}
      </label>
    </div>

    <button
      type="submit"
      class="mt-6 w-full rounded-xl bg-forest py-3 text-sm font-bold text-white transition hover:bg-ink"
    >
      Submeter material
    </button>
  </form>
</div>
