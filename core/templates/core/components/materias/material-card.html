<article
  class="rounded-2xl border border-ink/10 bg-white p-5 shadow-sm transition hover:-translate-y-1 hover:shadow-soft"
>
  <div class="flex items-center justify-between">
    <span class="rounded-lg bg-mint px-3 py-2 text-xs font-bold text-forest">
      {{ material.extensao|upper }} · {{ material.tipo|upper }}
    </span>
    <span class="text-xs text-ink/40">Aprovado</span>
  </div>

  <h2 class="mt-6 font-bold">{{ material.titulo }}</h2>
  <p class="mt-2 text-sm text-ink/55">
    {{ material.descricao|default:'Material partilhado pela comunidade.' }}
  </p>

  <div class="mt-4 flex items-center gap-2 text-sm">
    <span class="text-coral">★★★★★</span>
    <strong>{{ material.avaliacao_media|default:'0.0' }}</strong>
    <span class="text-xs text-ink/40">avaliação</span>
  </div>

  <div
    class="mt-6 flex items-center justify-between border-t border-ink/10 pt-4 text-xs text-ink/45"
  >
    <span>{{ material.cadeira.nome }} · {{ material.cadeira.ano }}.º ano</span>
    <a
      href="{{ material.ficheiro.url|default:'#' }}"
      class="font-bold text-forest hover:underline"
    >
      Abrir →
    </a>
  </div>
</article>
