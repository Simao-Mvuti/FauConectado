<div class="mx-auto max-w-xl px-4 py-8">
  <form
    class="rounded-2xl border border-ink/10 bg-white p-6 shadow-sm sm:p-8"
    action="{% url 'enviar_mentoria' %}"
    method="post"
  >
    {% csrf_token %}

    <!-- Ícone e Título -->
    <span
      class="grid h-11 w-11 place-items-center rounded-xl bg-[#e2f3e9] text-xl"
      >✦</span
    >
    <h3 class="mt-5 font-bold text-lg text-ink">Ser mentor</h3>
    <p class="mt-1 text-sm leading-6 text-ink/55">
      Apresenta a tua experiência para fazer parte da rede de mentores.
    </p>

    <!-- Exibir erros gerais do formulário, se houver -->
    {% if form.non_field_errors %}
      <div class="mt-4 rounded-xl bg-red-50 p-3 text-sm text-red-600">
        {{ form.non_field_errors }}
      </div>
    {% endif %}

    <div class="mt-6 space-y-4">
      <!-- Nome -->
      <label class="block text-xs font-bold text-ink" for="{{ form.nome.id_for_label }}">
        Nome *
        {{ form.nome }}
        {% if form.nome.errors %}
          <span class="text-xs text-red-500">{{ form.nome.errors.0 }}</span>
        {% endif %}
      </label>

      <!-- Curso e Ano (Lado a Lado) -->
      <div class="grid gap-4 sm:grid-cols-2">
        <label class="block text-xs font-bold text-ink" for="{{ form.curso.id_for_label }}">
          Curso *
          {{ form.curso }}
          {% if form.curso.errors %}
            <span class="text-xs text-red-500">{{ form.curso.errors.0 }}</span>
          {% endif %}
        </label>

        <label class="block text-xs font-bold text-ink" for="{{ form.ano.id_for_label }}">
          Ano *
          {{ form.ano }}
          {% if form.ano.errors %}
            <span class="text-xs text-red-500">{{ form.ano.errors.0 }}</span>
          {% endif %}
        </label>
      </div>

      <!-- Contacto -->
      <label class="block text-xs font-bold text-ink" for="{{ form.contacto_publico.id_for_label }}">
        Contacto Público / WhatsApp *
        {{ form.contacto_publico }}
        {% if form.contacto_publico.errors %}
          <span class="text-xs text-red-500">{{ form.contacto_publico.errors.0 }}</span>
        {% endif %}
      </label>
    </div>

    <!-- Botão de Submissão -->
    <button
      type="submit"
      class="mt-6 w-full cursor-pointer rounded-xl bg-forest py-3.5 text-sm font-bold text-white transition hover:bg-ink"
    >
      Candidatar-me
    </button>
  </form>
</div>
