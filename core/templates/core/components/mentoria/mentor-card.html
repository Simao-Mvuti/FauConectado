<article class="group relative flex flex-col justify-between rounded-2xl border border-ink/10 bg-white p-6 shadow-sm transition-all duration-300 hover:-translate-y-1 hover:shadow-soft">
  <div>
    <!-- Cabeçalho: Iniciais e Estado -->
    <div class="flex items-start justify-between">
      <div class="grid h-16 w-16 place-items-center rounded-2xl bg-mint/50 text-xl font-extrabold text-forest shadow-inner">
        {{ mentor.nome|slice:':2'|upper }}
      </div>
      <span class="inline-flex items-center gap-1.5 rounded-full bg-[#e2f3e9] px-3 py-1 text-[10px] font-bold uppercase tracking-wider text-forest">
        <span class="h-1.5 w-1.5 rounded-full bg-forest animate-pulse"></span>
        Disponível
      </span>
    </div>

    <!-- Informações Principais -->
    <div class="mt-5 flex items-start justify-between gap-3">
      <div>
        <h2 class="text-base font-bold text-ink group-hover:text-forest transition-colors">{{ mentor.nome }}</h2>
        <p class="mt-1 text-xs font-medium text-ink/55">
          {{ mentor.curso }} · <span class="text-ink font-bold">{{ mentor.ano }}.º ano</span>
        </p>
      </div>
      
      <!-- Avaliação -->
      <div class="text-right shrink-0">
        <div class="flex items-center justify-end gap-1 text-coral">
          <span class="text-xs">★</span>
          <span class="text-sm font-bold">{{ mentor.avaliacao_media|default:'5.0' }}</span>
        </div>
        <p class="mt-0.5 text-[10px] font-medium text-ink/40">
          ({{ mentor.total_avaliacoes|default:'0' }} avaliações)
        </p>
      </div>
    </div>
  </div>

  <!-- Botão de Ação Direta (WhatsApp / Contacto) -->
  <div class="mt-6 pt-4 border-t border-ink/10">
    <a
      href="https://wa.me/{{ mentor.contacto_publico|slugify }}"
      target="_blank"
      rel="noopener noreferrer"
      class="flex items-center justify-center gap-2 w-full rounded-xl bg-forest py-3 text-xs font-bold text-white transition-all hover:bg-ink shadow-md shadow-forest/10"
    >
      <span>Falar via WhatsApp</span>
      <span class="text-sm">→</span>
    </a>
  </div>
</article>
