{% extends "core/base.html" %}

{% block titulo %}Contacto | FauConectado{% endblock %}

{% block conteudo %}
<section class="mx-auto max-w-4xl px-5 py-16 lg:px-8 lg:py-24">
	<div class="grid gap-10 rounded-[2rem] bg-ink p-7 text-white sm:p-12 md:grid-cols-[.8fr_1.2fr]">
		<div>
			<p class="text-xs font-bold uppercase tracking-[.18em] text-coral">Estamos por perto</p>
			<h1 class="mt-4 font-display text-4xl leading-tight sm:text-5xl">Vamos conversar.</h1>
			<p class="mt-5 text-sm leading-7 text-white/55">Envia uma mensagem à equipa FauConectado. Respondemos em até 24 horas.</p>
			<p class="mt-8 text-sm text-white/70">✉ <span class="ml-2">hello@fauconectado.pt</span></p>
		</div>
		<form class="space-y-4" action="#" method="post">
			{% csrf_token %}
			<label class="block text-sm font-semibold" for="nome">Nome<input id="nome" name="nome" type="text" placeholder="O teu nome" class="mt-2 w-full rounded-xl border border-white/15 bg-white/10 px-4 py-3 text-sm font-normal text-white outline-none placeholder:text-white/35 focus:border-coral"></label>
			<label class="block text-sm font-semibold" for="email">Email<input id="email" name="email" type="email" placeholder="nome@email.com" class="mt-2 w-full rounded-xl border border-white/15 bg-white/10 px-4 py-3 text-sm font-normal text-white outline-none placeholder:text-white/35 focus:border-coral"></label>
			<label class="block text-sm font-semibold" for="mensagem">Mensagem<textarea id="mensagem" name="mensagem" rows="5" placeholder="Como podemos ajudar?" class="mt-2 w-full resize-none rounded-xl border border-white/15 bg-white/10 px-4 py-3 text-sm font-normal text-white outline-none placeholder:text-white/35 focus:border-coral"></textarea></label>
			<button type="submit" class="w-full rounded-xl bg-coral px-5 py-3.5 text-sm font-bold text-white hover:bg-white hover:text-ink">Enviar mensagem <span class="ml-2">→</span></button>
		</form>
	</div>
</section>
{% endblock %}
